<!DOCTYPE html>
<html>
<head>
    <title>Menggunakan media Query</title>
    <meta nam="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .smartphone{
            display: none;
        }
        .logouns{
            display: none;
            width: 150px;
            margin-top: 20px;
        }
        @media only screen and (max-width: 428px){
            body{
                background-color: yellow;
            }
            .smartphone{
                display: block;
            }
        }
        @media only screen and (min-width: 1025px){
            .logouns{
                display: block;
            }
        }
    </style>
</head>
<body>
    <h3>Menggunakan Media Query CSS3</h3>
    <div class="smartphone">
        <h2>Terdeteksi ukuran smartphone</h2>
    </div>
    <img src="UNS.png" class="logouns">
</body>
</html>
