<!DOCTYPE html>
<html>
<head>
    <title>Animasi Transisi & Keyframes CSS3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style type="text/css">
        .box{
            width: 40%;
            height: 100px;
            background: orange;
            border: 2px solid #212121;
            transition: all 1s ease-in-out;
            margin: 50px auto;
        }
        @keyframes spin {
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }
        @media (orientation: landscape){
            .box{
                width: 100%;
                height: 100px;
                background: blue;
                border-radius: 50%;
                animation: spin 2s linear infinite;
            }
        }
    </style>
</head>
<body>
    <h3>Transisi & Animasi CSS3</h3>
    <div class="box"></div>
    <p>ubah orientasi ke landscape/potrait dan sebaliknya untuk melihat efek transisi</p>
</body>
</html>
