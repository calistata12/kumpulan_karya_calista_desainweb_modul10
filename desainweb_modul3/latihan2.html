<!DOCTYPE html>
<html>
<head>
    <title>Navigasi</title>
    <style>
        ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
        }
        li {
            float: left;
        }
        li a{
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        li a:hover{
            background-color: #111;
        }
        .content {
            display: none;
            padding: 20px;
        }
        .content:target {
            display: block;
        }
        #home {
            display: block;
        }
        :target ~ #home {
            display: none;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#news">News</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="#about">About</a></li>
    </ul>
    <div id="news" class="content">
        <h1>News</h1>
        <p>Ini adalah halaman News (Berita).</p>
    </div>
    <div id="contact" class="content">
        <h1>Contact</h1>
        <p>Hubungi kami melalui kontak yang tertera di sini.</p>
    </div>
    <div id="about" class="content">
        <h1>About</h1>
        <p>Ini adalah halaman tentang kita.</p>
    </div>
    <div id="home" class="content">
        <h1>Home</h1>
        <p>Selamat datang di halaman utama (Home).</p>
    </div>
</body>
</html>
